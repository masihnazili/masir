name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project around index.html
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "masir",
            "private": true,
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "latest",
              "@capacitor/android": "latest"
            },
            "devDependencies": {
              "@capacitor/cli": "latest",
              "@capacitor/assets": "latest"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "app.masir.tracker",
            "appName": "مسیر",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npm install

      - name: Add Android platform
        run: npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            npx capacitor-assets generate --android --iconBackgroundColor '#0D1224' --iconBackgroundColorDark '#0D1224'
          fi

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: masir-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
