name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project around index.html
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "masir",
            "private": true,
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "latest",
              "@capacitor/android": "latest"
            },
            "devDependencies": {
              "@capacitor/cli": "latest",
              "@capacitor/assets": "latest"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "app.masir.tracker",
            "appName": "مسیر",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npm install

      - name: Add Android platform
        run: npx cap add android

      - name: App icon (plain PNG launcher icons, no adaptive XML)
        continue-on-error: true
        run: |
          if [ -f icon.png ]; then
            pip install --break-system-packages pillow || pip install pillow
            python3 - <<'PY'
          import os, glob
          from PIL import Image, ImageDraw
          src = Image.open('icon.png').convert('RGBA')
          res = 'android/app/src/main/res'
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for d, px in sizes.items():
              folder = f'{res}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              im = src.resize((px, px), Image.LANCZOS)
              for name in ('ic_launcher.png', 'ic_launcher_foreground.png'):
                  im.save(f'{folder}/{name}')
              m = Image.new('L', (px*4, px*4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, px*4-1, px*4-1), fill=255)
              m = m.resize((px, px), Image.LANCZOS)
              r = Image.new('RGBA', (px, px), (0, 0, 0, 0))
              r.paste(im, (0, 0), m)
              r.save(f'{folder}/ic_launcher_round.png')
          for x in glob.glob(f'{res}/mipmap-anydpi-v26/ic_launcher*.xml'):
              os.remove(x)
          print('icons ok')
          PY
          fi
      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: masir-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
