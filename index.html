<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#F2F2F7"><title>مسیر</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..800&display=swap">
<style>
/* Layout: iOS-style grouped lists on a quiet system background. Translucent material for the status bar and tab bar, large title, concentric activity rings (one per life area), squircle icons, press feedback on pointer-down, draggable spring sheets. System-color palette, one color per area. */
:root{
  --bg:#F2F2F7;--surface:#FFFFFF;--surface2:#E8E8ED;--ink:#1C1C1E;--muted:#6C6C70;--line:rgba(60,60,67,.16);
  --brand:#007AFF;--on-brand:#FFFFFF;--ok:#34C759;
  --flame:#FF9500;--gem:#1F9DB8;--good:#248A3D;--bad:#E5362B;
  --c-gym:#FF3B30;--c-lang:#007AFF;--c-trade:#30B150;--c-music:#AF52DE;--c-diet:#FF9500;--on-c:#FFFFFF;
  --mat:rgba(242,242,247,.74);--mat2:rgba(249,249,249,.8);--dim:rgba(0,0,0,.32);
  --font-body:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --spring:cubic-bezier(.2,.9,.3,1.12);--out:cubic-bezier(.2,.9,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--surface:#1C1C1E;--surface2:#2C2C2E;--ink:#F2F2F7;--muted:#9A9AA1;--line:rgba(235,235,245,.16);
  --brand:#0A84FF;--ok:#30D158;--flame:#FF9F0A;--gem:#40CBE0;--good:#30D158;--bad:#FF453A;
  --c-gym:#FF453A;--c-lang:#0A84FF;--c-trade:#30D158;--c-music:#BF5AF2;--c-diet:#FF9F0A;
  --mat:rgba(0,0,0,.66);--mat2:rgba(29,29,31,.8);--dim:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1C1C1E;--surface2:#2C2C2E;--ink:#F2F2F7;--muted:#9A9AA1;--line:rgba(235,235,245,.16);
  --brand:#0A84FF;--ok:#30D158;--flame:#FF9F0A;--gem:#40CBE0;--good:#30D158;--bad:#FF453A;
  --c-gym:#FF453A;--c-lang:#0A84FF;--c-trade:#30D158;--c-music:#BF5AF2;--c-diet:#FF9F0A;
  --mat:rgba(0,0,0,.66);--mat2:rgba(29,29,31,.8);--dim:rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}
.ic.sm{width:14px;height:14px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 60%,transparent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num,.chip b,.hero .rc b,.stat b,.gembig b,.tm-t,.chestbox b,.lv-n,.pip b{letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}

.shell{max-width:520px;margin-inline:auto;padding:0 16px 120px}

/* status bar: material + scroll-edge fade instead of a hard divider */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:8px;padding:10px 16px;margin-inline:-16px;background:var(--mat);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.top::after{content:'';position:absolute;inset-inline:0;top:100%;height:14px;background:linear-gradient(var(--bg),transparent);opacity:.7;pointer-events:none}
.chip{display:flex;align-items:center;gap:5px;background:var(--surface);border-radius:99px;padding:5px 12px;font-weight:700;box-shadow:0 0 0 .5px var(--line)}
.chip b{font-weight:800;font-size:17px;color:var(--ink)}
.chip span{font-size:12px;color:var(--muted);font-weight:600}
.chip.fl{color:var(--flame)}.chip.gm{color:var(--gem)}
.lv{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.lv-n{min-width:30px;height:30px;padding:0 8px;border-radius:99px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.lv-b{flex:1;min-width:0;max-width:150px}
.lv-b small{display:block;font-size:11px;color:var(--muted);line-height:1.4;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--brand));transition:width .5s var(--out)}

.muted{color:var(--muted)}
.lt{padding-top:14px}
.lt .d{font-size:13px;color:var(--muted);font-weight:600}
.lt h1{font-size:34px;font-weight:800;line-height:1.3}
h2{font-size:22px;font-weight:800;line-height:1.4;text-wrap:balance}
h3{font-size:17px;font-weight:700;line-height:1.5}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}

.hero{display:flex;align-items:center;gap:18px;background:var(--surface);border-radius:22px;padding:18px;margin-top:10px}
.rwrap{position:relative;width:132px;height:132px;flex:none}
.rwrap svg{width:132px;height:132px;transform:rotate(-90deg)}
.rwrap circle{fill:none;stroke-width:7}
.rp{stroke-linecap:round}
.rwrap .rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc b{font-size:24px;font-weight:800}
.rc small{font-size:10.5px;color:var(--muted);line-height:1.2}
.rls{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.rl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.rl i{width:10px;height:10px;border-radius:50%;flex:none}
.rl b{margin-inline-start:auto;font-size:13px;color:var(--muted);font-weight:700}
.idn{font-size:14px;color:var(--muted);text-align:center;margin-top:12px;padding:0 8px}

.pips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pip{display:flex;flex-direction:column;align-items:center;background:var(--surface);border-radius:16px;padding:9px 4px;text-align:center;min-width:0}
.pip b{font-weight:800;font-size:20px}
.pip span{font-size:12px;font-weight:600;color:var(--muted)}
.pip em{font-style:normal;font-size:12px;font-weight:700;color:var(--gem);display:flex;align-items:center;gap:3px}
.pip.on{background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.pip.on b{color:var(--good)}

.note{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--flame) 14%,var(--surface));border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px}
.note .ic{color:var(--flame);margin-top:3px}
.chest{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;border:0;text-align:start;background:color-mix(in srgb,var(--gem) 14%,var(--surface));color:var(--ink);border-radius:18px;padding:12px 14px;font-weight:700;transition:transform .1s ease-out}
.chest .ic{width:34px;height:34px;color:var(--gem)}
.chest small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.chest:active{transform:scale(.97)}
@media (prefers-reduced-motion:no-preference){.chest .ic{animation:wob 2.4s ease-in-out infinite}}
@keyframes wob{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-8deg)}86%{transform:rotate(8deg)}94%{transform:rotate(-4deg)}}

.lightrow{display:flex;align-items:center;gap:12px;margin-top:12px;background:var(--surface);border-radius:18px;padding:12px 14px}
.lightrow div{flex:1;min-width:0}
.lightrow small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.sw{width:51px;height:31px;border-radius:99px;border:0;background:rgba(120,120,128,.32);position:relative;padding:0;flex:none;transition:background .25s var(--out)}
.sw .knob{position:absolute;top:2px;inset-inline-start:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.sw.on{background:var(--ok)}
.sw.on .knob{transform:translateX(-20px)}

.slot{margin-top:24px}
.slot-h{display:flex;align-items:center;gap:8px;margin:0 6px 7px}
.slot-h h3{font-size:13px;font-weight:700;color:var(--muted)}
.slot-h .now{background:var(--brand);color:var(--on-brand);font-size:11px;font-weight:700;border-radius:99px;padding:0 8px}
.slot-h .cnt{margin-inline-start:auto;color:var(--muted);font-size:13px;font-weight:600}

/* grouped list: rows share one rounded surface, hairline starts after the icon */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;overflow:hidden}
.list:empty{display:none}
.list>*{position:relative}
.list>*+*::before{content:'';position:absolute;top:0;inset-inline:16px 0;height:.5px;background:var(--line)}
.list>*:has(>.ico)+*::before,.list>*+*:has(>.ico)::before{inset-inline-start:72px}
.task,.rw,.trow{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:62px;background:transparent;border:0;width:100%;text-align:start}
.ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--c);color:var(--on-c);flex:none}
.ico .ic{width:23px;height:23px}
.tt{flex:1;min-width:0;display:flex;flex-direction:column}
.tt b{font-weight:700;line-height:1.5;font-size:16px}
.task.done .tt b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.tt small{color:var(--muted);font-size:13px;line-height:1.5}
.tt .pr{display:flex;align-items:center;gap:8px;margin-top:5px}
.tt .pr .bar{flex:1}
.tt .pr span{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.acts{display:flex;align-items:center;flex:none}
.chk{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0;border-radius:50%;transition:transform .1s ease-out}
.chk::before{content:'';grid-area:1/1;width:28px;height:28px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 60%,transparent);transition:background .25s var(--out),border-color .25s var(--out)}
.chk .ic{grid-area:1/1;width:15px;height:15px;stroke-width:3}
.chk:not(.go) .ic{opacity:0;transform:scale(.3);color:var(--on-c)}
.chk.on:not(.go) .ic{opacity:1;transform:scale(1);transition:transform .4s var(--spring),opacity .15s}
.chk.go{color:var(--c)}
.chk.go::before{background:color-mix(in srgb,var(--c) 14%,transparent)}
.chk.on::before{background:var(--c);border-color:var(--c)}
.chk.on.go{color:var(--on-c)}
.chk:active{transform:scale(.92)}
.chk.sm{width:36px;height:36px;color:var(--muted)}
.chk.sm::before{display:none}
.chk.sm .ic{width:18px;height:18px;stroke-width:2;opacity:1;transform:none}

.btn{border:0;border-radius:14px;padding:12px 20px;background:var(--brand);color:var(--on-brand);font-weight:700;transition:transform .1s ease-out,opacity .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.ghost{background:color-mix(in srgb,var(--brand) 13%,var(--surface));color:var(--brand)}
.btn.ghost.bad{background:color-mix(in srgb,var(--bad) 13%,var(--surface));color:var(--bad)}
.btn.sm{padding:6px 14px;font-size:14px;border-radius:99px}
.btn.big{flex:1;font-size:17px;padding:14px}
.btn:disabled{opacity:.4;cursor:default}
.btn .cost{color:inherit}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}

.tabs{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--mat2);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs>div{display:flex;width:100%;max-width:520px}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;padding:3px 0;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px;transition:transform .1s ease-out,color .2s}
.tab .ic{width:26px;height:26px}
.tab:active{transform:scale(.94)}
.tab.on{color:var(--brand)}

.card{background:var(--surface);border-radius:20px;padding:16px}
.wk{display:grid;grid-template-columns:auto repeat(7,1fr);gap:8px 4px;align-items:center}
.wk .dl{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.wk .dl.now{color:var(--brand)}
.wk .al{color:var(--c);display:grid;place-items:center;width:28px}
.cell{justify-self:center;width:22px;height:22px;border-radius:50%;border:2px solid transparent}
.cell.full{background:var(--c)}
.cell.part{border-color:var(--c);background:linear-gradient(to top,var(--c) 50%,transparent 50%)}
.cell.plan{border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.cell.miss{background:var(--surface2)}
.cell.off{border:0;width:5px;height:5px;background:var(--line)}
.cell.now{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-inline-end:5px}

.area{margin-top:24px}
.area-h{display:flex;align-items:center;gap:10px;margin:0 2px 8px}
.area-h .ico{width:34px;height:34px;border-radius:9px}
.area-h .ico .ic{width:20px;height:20px}
.area-h h3{font-size:19px;font-weight:800}
.area-h .add{margin-inline-start:auto}
.trow{min-height:56px;transition:background .1s}
.trow:active{background:var(--surface2)}
.trow div{flex:1;min-width:0}
.trow b{display:block;font-weight:600;line-height:1.5}
.trow small{color:var(--muted);font-size:12.5px}
.trow .ic{color:var(--muted);width:18px;height:18px}
.idn-in{margin-bottom:8px;font-size:14px}

label,.lab{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:14px}
input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:5px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:0;border-radius:12px;padding:11px 14px}
.card textarea,.idn-in{background:var(--surface2)}
.idn-in{display:block;width:100%;border:0;border-radius:12px;padding:10px 14px;color:var(--ink);font:inherit;font-size:14px}
textarea{resize:vertical;min-height:68px}
.chk-l{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px;font-weight:500}
.chk-l input{width:22px;height:22px;accent-color:var(--brand);margin:0}
.days{display:flex;gap:6px;margin-top:6px}
.dchip{flex:1;min-width:0;height:40px;border-radius:12px;border:0;background:var(--surface2);font-weight:700;color:var(--muted);padding:0;transition:transform .1s ease-out,background .2s}
.dchip:active{transform:scale(.94)}
.dchip.on{background:var(--brand);color:var(--on-brand)}

.lvcard{display:flex;flex-direction:column;gap:8px}
.lvcard .big{font-size:30px;font-weight:800;line-height:1.3}
.prow{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.prow:first-child{margin-top:0}
.prow .l{display:flex;align-items:center;gap:8px;font-weight:700}
.prow .l .ic{width:20px;height:20px;color:var(--c)}
.prow .l span{margin-inline-start:auto;color:var(--muted);font-size:12.5px;font-weight:600}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat .dl{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.hc{aspect-ratio:1;border-radius:8px;background:var(--surface2)}
.hc.l1{background:color-mix(in srgb,var(--brand) 30%,var(--surface2))}
.hc.l2{background:color-mix(in srgb,var(--brand) 62%,var(--surface2))}
.hc.l3{background:var(--brand)}
.hc.fz{box-shadow:inset 0 0 0 2px var(--gem)}
.hc.fut{opacity:.4}
.hc.now{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 4px;border-radius:18px;background:var(--surface);min-width:0}
.bd .ic{width:28px;height:28px;color:var(--flame)}
.bd b{font-size:12.5px;line-height:1.4;font-weight:700}
.bd small{font-size:11px;color:var(--muted);line-height:1.4}
.bd.lock{opacity:.5}
.bd.lock .ic{color:var(--muted)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .card{padding:12px 14px}
.stat b{font-size:30px;font-weight:800;display:block}
.stat small{color:var(--muted);font-size:12.5px}

.gembig{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:22px;padding:18px;margin-top:10px}
.gembig .ic{width:44px;height:44px;color:var(--gem)}
.gembig b{font-size:44px;font-weight:800;display:block}
.cost{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--gem)}
details{background:var(--surface);border-radius:18px;padding:12px 16px}
summary{font-weight:700;cursor:pointer}
details ol{margin:10px 0 0;padding-inline-start:20px;color:var(--muted);font-size:14px}
details li{margin-bottom:6px}
details li b{color:var(--ink)}

.ov{position:fixed;inset:0;z-index:40;background:var(--dim);display:flex;align-items:flex-end;justify-content:center;transition:opacity .3s ease-out}
.ov.out{opacity:0}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:28px 28px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom,0px));min-width:0;overscroll-behavior:contain;will-change:transform}
.sheet.enter{animation:sheetin .5s var(--spring)}
.ov.enter{animation:fade .3s ease-out}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{display:grid;place-items:center;height:22px;touch-action:none;cursor:grab}
.grab i{display:block;width:36px;height:5px;border-radius:99px;background:rgba(120,120,128,.4)}
.sh-h{display:flex;align-items:center;gap:12px;margin-bottom:4px;touch-action:none}
.sh-h>div:not(.ico){flex:1;min-width:0}
.sh-h p{font-size:13px;color:var(--muted)}
.x{border:0;background:rgba(120,120,128,.18);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;padding:0;color:var(--muted);transition:transform .1s ease-out}
.x:active{transform:scale(.92)}
.x .ic{width:16px;height:16px;stroke-width:2.5}
.tm{display:flex;flex-direction:column;gap:16px;margin-top:10px}
.tm-t{font-size:72px;font-weight:300;text-align:center;color:var(--c)}
.hint{font-size:13px;color:var(--muted);margin-top:16px;margin-bottom:8px}
.chestbox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 0 20px}
.chestbox .ic{width:72px;height:72px;color:var(--gem)}
.chestbox b{font-size:52px;font-weight:800;color:var(--gem)}
@media (prefers-reduced-motion:no-preference){.chestbox .ic{animation:pop .6s var(--spring)}}
@keyframes pop{from{transform:scale(.3) rotate(-20deg)}to{transform:none}}

.toasts{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:rgba(44,44,46,.9);color:#fff;font-weight:600;font-size:14px;border-radius:99px;padding:9px 18px;max-width:100%;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:toastin .35s var(--spring)}}
@keyframes toastin{from{transform:translateY(12px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.sync{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

function aiAsk(prompt,signal,onText){

   {method:'POST',signal:signal,headers:{'Content-Type':'application/json','x-goog-api-key':AI.key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})})
  .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
    if(!r.ok)throw {code:'http',status:r.status};
    var c=j.candidates&&j.candidates[0],t=c&&c.content&&c.content.parts&&c.content.parts.map(function(x){return x.text||''}).join('');
    if(!t)throw {code:'empty'};onText(t);return t})},

 });

var tm={id:null,running:false,start:0,acc:0},tmIv=null;

  var o={id:d.id,area:d.area,title:String(d.title).trim(),cue:String(d.cue||'').trim(),slot:d.slot,days:d.days.length?d.days:[0,1,2,3,4,5,6],type:d.type,
   target:d.type==='check'?1:num(d.target,1,d.type==='count'?99:600,d.type==='count'?8:20),min:d.type==='timer'?num(d.min,1,600,5):0,
   xp:num(d.xp,1,100,10),core:!!d.core,weekly:d.type==='check'?num(d.weekly,0,7,0):0};
  var i=S.tasks.findIndex(function(t){return t.id===o.id});if(i>-1)S.tasks[i]=o;else S.tasks.push(o);
  recompute(key(today()));persist();closeSheet();render()},
 deltask:function(){if(!draft.confirmDel){draft.confirmDel=true;renderSheet();return}
  S.tasks=S.tasks.filter(function(t){return t.id!==draft.id});recompute(key(today()));persist();closeSheet();render()},
 buy:function(el){var r=S.rewards.find(function(x){return x.id===el.dataset.id});if(!r||S.gems<r.cost)return;
  S.gems-=r.cost;S.redeemed.unshift({t:r.title,c:r.cost,d:key(today())});S.redeemed=S.redeemed.slice(0,30);toast('بیرون بیا، لذت ببر: '+r.title);persist();render()},
 buyfreeze:function(){if(S.gems<FREEZE_COST||S.freezes>=FREEZE_MAX)return;S.gems-=FREEZE_COST;S.freezes++;toast('سپر زنجیره گرفتی');persist();render()},
 addreward:function(){draft={isNew:true,id:uid(),title:'',cost:50};sheet={type:'reward'};renderSheet()},
 editreward:function(el){var r=S.rewards.find(function(x){return x.id===el.dataset.id});if(!r)return;draft=Object.assign({isNew:false},r);sheet={type:'reward'};renderSheet()},
 savereward:function(){var d=draft;if(!String(d.title).trim()){toast('یک عنوان بنویس');return}
  var o={id:d.id,title:String(d.title).trim(),cost:num(d.cost,1,9999,50)};
  var i=S.rewards.findIndex(function(x){return x.id===o.id});if(i>-1)S.rewards[i]=o;else S.rewards.push(o);persist();closeSheet();render()},
 delreward:function(){if(!draft.confirmDel){draft.confirmDel=true;renderSheet();return}
  S.rewards=S.rewards.filter(function(x){return x.id!==draft.id});persist();closeSheet();render()},
 reset:function(){if(!confirmReset){confirmReset=true;render();return}
  confirmReset=false;S=defaults();persist();toast('از نو شروع کردیم');render()}
};

var app=document.getElementById('app');
app.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el||el.disabled)return;var f=A[el.dataset.a];if(f)f(el,e)});
function onField(e){var t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;var p=f.split(':'),ns=p[0],nm=p[1];
 var val=t.type==='checkbox'?t.checked:t.value;
 if(ns==='idn'){S.idn[nm]=val;persist()}
 else if(ns==='rev'){var wk=key(weekStart(today()));(S.reviews[wk]=S.reviews[wk]||{})[nm]=val;persist()}
 else if(ns==='ai'&&draft){draft[nm]=val}
 else if(ns==='d'&&draft){draft[nm]=val;if(e.type==='change'&&t.dataset.rr){if(nm==='type'){if(val==='check')draft.target=1;else if(val==='count'&&draft.target<2)draft.target=8;else if(val==='timer'&&draft.target<2)draft.target=20}renderSheet()}}}
app.addEventListener('input',onField);
app.addEventListener('change',onField);
/* sheet drag: follows the finger 1:1, resists upward, hands release velocity to a spring or a projected dismiss */
var drag=null;
app.addEventListener('pointerdown',function(e){
 var h=e.target.closest('[data-drag],.sh-h');if(!h||e.target.closest('button'))return;
 var sh=document.querySelector('#sheet .sheet');if(!sh||closing)return;
 var y0=0;try{y0=new DOMMatrixReadOnly(getComputedStyle(sh).transform).m42||0}catch(x){}
 sh.style.animation='none';sh.style.transition='none';sh.style.transform='translateY('+y0+'px)';
 drag={sh:sh,el:h,id:e.pointerId,sy:e.clientY,y0:y0,y:y0,pts:[{t:e.timeStamp,y:e.clientY}]};
 try{h.setPointerCapture(e.pointerId)}catch(x){}
});
app.addEventListener('pointermove',function(e){
 if(!drag||e.pointerId!==drag.id)return;
 var y=drag.y0+(e.clientY-drag.sy);if(y<0)y=y*0.55;
 drag.y=y;drag.sh.style.transform='translateY('+y+'px)';
 drag.pts.push({t:e.timeStamp,y:e.clientY});if(drag.pts.length>6)drag.pts.shift();
});
function endDrag(e){
 if(!drag||e.pointerId!==drag.id)return;var d=drag;drag=null;
 var p=d.pts,a=p[0],b=p[p.length-1],dt=Math.max(1,b.t-a.t),v=(b.y-a.y)/dt;
 var proj=d.y+v*0.99/(1-0.99)*0.1;
 if(d.y>8&&(proj>d.sh.offsetHeight*0.45||v>0.9)){closeSheet()}
 else{d.sh.style.transition='transform .5s cubic-bezier(.2,.9,.3,1.12)';d.sh.style.transform='translateY(0)'}
}
app.addEventListener('pointerup',endDrag);
app.addEventListener('pointercancel',endDrag);


/* ---------- boot ---------- */
function boot(){
 S=norm(loadLocal()||defaults());settle();checkBadges();persist();render();
 setInterval(function(){var k=key(today());if(S.streak.anchor!==key(addDays(today(),-1))){settle();persist();render()}},60000);
 document.addEventListener('visibilitychange',function(){if(!document.hidden&&sheet&&sheet.type==='timer')tmTick()});
 connect();
}
function connect(){
 if(!(window.claude&&window.claude.use))return;
 Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
  var db=r[0],user=r[1];if(!db||!user)return null;
  return user.id().then(function(id){if(!id)return null;dbDoc=db.doc('data/users/'+id+'/state');return dbDoc.get()});
 }).then(function(snap){
  if(!dbDoc)return;syncMode='cloud';
  if(snap&&snap.exists){
   try{var remote=JSON.parse(snap.data().state);
    if(remote&&remote.v&&(remote.savedAt||0)>(S.savedAt||0)){S=norm(remote);settle();checkBadges();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render();return}}catch(e){}
  }
  dirty=true;flush();if(tab==='plan')render();
 }).catch(function(){syncMode='local';dbDoc=null});
}
boot();
})();
